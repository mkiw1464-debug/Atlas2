name: Build AtlasMod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Untap broken taps
        run: brew untap aws/tap || true

      - name: Install ldid
        run: brew install ldid || true

      - name: Clone Theos
        run: |
          git clone --recursive \
            https://github.com/theos/theos.git $THEOS

      - name: Get iOS SDKs
        run: |
          git clone --depth 1 \
            https://github.com/theos/sdks.git /tmp/sdks
          mv /tmp/sdks/iPhoneOS*.sdk $THEOS/sdks/

      - name: Substrate Header
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/theos/headers/master/CydiaSubstrate.h \
            -o $THEOS/include/substrate.h

      - name: Build
        run: |
          export PATH=$THEOS/bin:$PATH
          make package FINALPACKAGE=1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AtlasMod-OB54
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
          retention-days: 30
