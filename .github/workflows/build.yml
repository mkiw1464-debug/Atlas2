name: Build AtlasMod Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Homebrew
        run: |
          brew untap aws/tap || true

      - name: Install Dependencies
        run: |
          brew install ldid xz || true

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Download iOS SDK
        run: |
          # Guna theos-jailed SDK yang confirm ada
          git clone https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -r /tmp/theos-sdks/*.sdk $THEOS/sdks/ || true
          ls $THEOS/sdks/

      - name: Setup Substrate Headers
        run: |
          mkdir -p $THEOS/include
          curl -L -o $THEOS/include/substrate.h \
            https://raw.githubusercontent.com/theos/headers/master/CydiaSubstrate.h

      - name: Build
        run: |
          export PATH=$THEOS/bin:$PATH
          make package FINALPACKAGE=1 2>&1

      - name: Collect Output
        run: |
          mkdir -p output
          find . -name "*.dylib" | head -1 | xargs -I{} cp {} output/AtlasMod.dylib || true
          find . -name "*.deb" | head -1 | xargs -I{} cp {} output/ || true
          ls -la output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtlasMod-OB54
          path: output/
          retention-days: 30
